<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>027 Best Practices & Event Handling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 60px;
      padding-bottom: 40px;
      line-height: 1.6;
    }
    .score-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .badge-score { background: #3b82f6; color: white; }
    .badge-correct { background: var(--success); color: white; }
    .badge-incorrect { background: var(--danger); color: white; }
    
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .quiz-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .quiz-header h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .quiz-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.95rem;
    }
    .question-body {
      font-size: 1rem;
      color: var(--text);
    }
    .question-body pre, .option-label pre {
      background: #060911;
      border: 1px solid #1e293b;
      padding: 0.75rem;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      margin: 0.5rem 0;
      overflow-x: auto;
    }
    .question-body code, .option-label code {
      font-family: 'Fira Code', monospace;
      background: rgba(0,0,0,0.3);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #fbbf24;
      font-size: 0.9em;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: #0c1322;
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-item:hover {
      border-color: var(--accent);
      background: #111a2e;
    }
    .option-item input[type="radio"] {
      margin-top: 0.25rem;
      cursor: pointer;
      accent-color: var(--accent);
      width: 1.1rem;
      height: 1.1rem;
    }
    .option-label {
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .option-item.correct {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
    }
    .option-item.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-bg) !important;
    }
    .btn-submit {
      align-self: flex-start;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
    }
    .feedback-box {
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.pass {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .feedback-box.fail {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="score-bar">
    <div>📊 <span id="quiz-title-nav"></span></div>
    <div class="score-badge">
      <span class="badge badge-score" id="score-text">Score: 0%</span>
      <span class="badge badge-correct" id="correct-text">Correct: 0</span>
      <span class="badge badge-incorrect" id="incorrect-text">Incorrect: 0</span>
    </div>
  </div>

  <div class="container">
    <div class="quiz-header">
      <h1 id="quiz-title-main"></h1>
      <p id="quiz-desc"></p>
    </div>

    <div id="questions-container" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
  </div>

  <script>
    const rawQuizData = {"quiz_id":6038720,"quiz_description":null,"quiz_title":"Best Practices & Event Handling","pass_percent":null,"questions":[{"_class":"assessment","id":68706458,"assessment_type":"multiple-choice","prompt":{"question":"<p>How should you typically store your component functions?</p>","relatedLectureIds":"","feedbacks":["That's wrong. You can do that and if you prefer that approach, it's okay. But it's not recommended because it makes the code less maintainable.","That's wrong. Storing components inside of other components does not just lead to maintainability issues but also to performance issues.","That's correct - this is the recommended approach.","That's wrong and it won't work. React projects are all about having multiple components - not just one."],"answers":["<p>All in one big file.</p>","<p>All in one component.</p>","<p>Split across multiple files (one component per file)</p>","<p>Split across multiple projects</p>"]},"correct_response":["c"],"section":"","question_plain":"How should you typically store your component functions?","related_lectures":[]},{"_class":"assessment","id":68706490,"assessment_type":"multiple-choice","prompt":{"question":"<p>What's the purpose of the special \"children\"&nbsp;prop?</p>","relatedLectureIds":"","feedbacks":["That's correct. \"children\" will receive whichever content you pass between the opening and closing tags of your component.","That's wrong - you can absolutely use this prop. It's automatically set by React but it's not restricted to \"internal usage\" or anything like that.","That's wrong - you can use ALL your components as often as needed. This prop has nothing to do with that.","That's wrong. Built-in components might indeed use the children prop to allow you to pass content between their tags but you don't have to use the children prop for that."],"answers":["<p>You can use it to pass and use content between your component's opening &amp; closing tags.</p>","<p>You're not allowed to use it since it's used internally by React.</p>","<p>You can use it to use a component more than once.</p>","<p>You can use it to pass data to built-in components (between their opening and closing tags)</p>"]},"correct_response":["a"],"section":"","question_plain":"What's the purpose of the special \"children\"&nbsp;prop?","related_lectures":[]},{"_class":"assessment","id":68706518,"assessment_type":"multiple-choice","prompt":{"question":"<p>How can you handle user events in React projects?</p>","relatedLectureIds":"","feedbacks":["That's wrong, there is no such built-in prop.","That's wrong. Whilst this is how you would add event listeners to elements in vanilla JavaScript, that's not how you do it in React projects.","That's wrong - there are no built-in props like this","That's correct. The built-in elements support props like onClick to allow you to define functions that should be triggered when the specified event occurs."],"answers":["<p>Via the built-in <code>onEvent</code> prop (e.g., <code>onEvent('click')</code>)</p>","<p>Via the built-in <code>addEventListener()</code> method (e.g., <code>addEventListener('click')</code>)</p>","<p>Via the built-in <code>on-xyz</code> prop (e.g., <code>on-click</code>)</p>","<p>Via the built-in <code>onXYZ</code> props (e.g., <code>onClick</code>)</p>"]},"correct_response":["d"],"section":"","question_plain":"How can you handle user events in React projects?","related_lectures":[]},{"_class":"assessment","id":68706834,"assessment_type":"multiple-choice","prompt":{"question":"<p>To execute code upon events, which value must be passed to event props like <code>onClick</code>?</p>","relatedLectureIds":"","feedbacks":["That's wrong. The expression code would be executed when the element with the prop is first rendered / evaluated, NOT when the event occurs.","That's wrong. This code wouldn't do anything and it would especially NOT lead to the handleClick function being executed","That's correct. By using this code, React is able to call handleClick() when the event occurs.","That's wrong (and a common mistake). This code would actually execute the handleClick() function when the element to which this prop is added is evaluated / rendered for the first time, NOT when the event occurs. So the function would run too early and it would be the result of that function execution that would be set as a value for the onClick prop (hence doing nothing when the actual event occurs)."],"answers":["<p>Any expression of your choice (e.g., <code>onClick={age = 5}</code>)</p>","<p>A string value that contains the name of the function that should be executed (e.g., <code>onClick=\"handleClick\"</code>)</p>","<p>A pointer to the function that should be executed (e.g., <code>onClick={handleClick}</code>)</p>","<p>The function execution of the function that should be executed (e.g., <code>onClick={handleClick()}</code>)</p>"]},"correct_response":["c"],"section":"","question_plain":"To execute code upon events, which value must be passed to event props like onClick?","related_lectures":[]},{"_class":"assessment","id":68708418,"assessment_type":"multiple-choice","prompt":{"question":"<p>How can you \"configure\"&nbsp;the execution of an event-dependent function (e.g., define which arguments get passed to it)?</p>","relatedLectureIds":"","feedbacks":["That's wrong, there are ways of gaining more control.","That's wrong - this code will lead to the handleClick() function being executed too early (when the element to which the prop is added is evaluated / rendered for the first time). The function will NOT be executed when the event occurs.","That's wrong, using this method in React is pretty much always wrong. It's not the \"React way\" of handling events. You should use the event props (onClick etc).","That's the correct choice! By wrapping the execution of your event handling function with another function, it's that other function that's passed as a value to the event-handling prop. Therefore, your main function (=&gt; handleClick in this example) does NOT get executed too early but instead only when the event occurs."],"answers":["<p>You can't</p>","<p>By executing the function yourself (e.g., <code>onClick={handleClick(5)}</code>)</p>","<p>By adding an event listener via the <code>addEventListener()</code> method (e.g., <code>addEventListener('click')</code>)</p>","<p>By wrapping the function with another function (e.g., <code>onClick={()&nbsp;=&gt;&nbsp;handleClick(5)}</code>)</p>"]},"correct_response":["d"],"section":"","question_plain":"How can you \"configure\"&nbsp;the execution of an event-dependent function (e.g., define which arguments get passed to it)?","related_lectures":[]}]};
    const questions = rawQuizData.questions || [];
    const userAnswers = new Map(); // questionIndex -> { selectedIndex, isCorrect }

    document.getElementById('quiz-title-nav').textContent = "027 Best Practices & Event Handling";
    document.getElementById('quiz-title-main').textContent = "027 Best Practices & Event Handling";
    document.getElementById('quiz-desc').textContent = rawQuizData.quiz_description || 'Select the correct answer for each question below and click Submit.';

    function updateScore() {
      let correct = 0;
      let incorrect = 0;
      userAnswers.forEach((ans) => {
        if (ans.isCorrect) correct++;
        else incorrect++;
      });
      const answered = correct + incorrect;
      const pct = answered > 0 ? ((correct / questions.length) * 100).toFixed(1) : 0;

      document.getElementById('score-text').textContent = 'Score: ' + pct + '% (' + correct + '/' + questions.length + ')';
      document.getElementById('correct-text').textContent = 'Correct: ' + correct;
      document.getElementById('incorrect-text').textContent = 'Incorrect: ' + incorrect;
    }

    const container = document.getElementById('questions-container');

    questions.forEach((q, qIndex) => {
      const qPrompt = q.prompt || {};
      const answers = qPrompt.answers || [];
      const feedbacks = qPrompt.feedbacks || [];
      const correctChar = (q.correct_response && q.correct_response[0]) ? q.correct_response[0].toLowerCase() : 'a';
      const correctIndex = correctChar.charCodeAt(0) - 97;

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'question-' + qIndex;

      let optionsHtml = '';
      answers.forEach((ans, aIndex) => {
        const optionId = 'q_' + qIndex + '_opt_' + aIndex;
        optionsHtml += `
          <label class="option-item" id="item_${qIndex}_${aIndex}" for="${optionId}">
            <input type="radio" name="q_${qIndex}" id="${optionId}" value="${aIndex}" />
            <div class="option-label">${ans}</div>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="question-top">
          <span>Question ${qIndex + 1} of ${questions.length}</span>
        </div>
        <div class="question-body">${qPrompt.question || ''}</div>
        <div class="options-list">${optionsHtml}</div>
        <button class="btn-submit" onclick="submitQuestion(${qIndex}, ${correctIndex})">Submit Answer</button>
        <div class="feedback-box" id="feedback-${qIndex}"></div>
      `;

      container.appendChild(card);
    });

    window.submitQuestion = function(qIndex, correctIndex) {
      const selected = document.querySelector('input[name="q_' + qIndex + '"]:checked');
      if (!selected) {
        alert('Please select an option first!');
        return;
      }

      const selectedIndex = parseInt(selected.value, 10);
      const isCorrect = selectedIndex === correctIndex;
      userAnswers.set(qIndex, { selectedIndex, isCorrect });

      const q = questions[qIndex];
      const feedbacks = (q.prompt && q.prompt.feedbacks) ? q.prompt.feedbacks : [];
      const feedbackText = feedbacks[selectedIndex] || (isCorrect ? "Correct answer!" : "Incorrect answer.");

      // Visual classes
      const card = document.getElementById('question-' + qIndex);
      const options = card.querySelectorAll('.option-item');
      options.forEach((opt, idx) => {
        opt.classList.remove('correct', 'incorrect');
        if (idx === correctIndex) opt.classList.add('correct');
        else if (idx === selectedIndex && !isCorrect) opt.classList.add('incorrect');
      });

      const feedbackBox = document.getElementById('feedback-' + qIndex);
      feedbackBox.className = 'feedback-box show ' + (isCorrect ? 'pass' : 'fail');
      feedbackBox.innerHTML = '<strong>' + (isCorrect ? '✅ Correct! ' : '❌ Incorrect. ') + '</strong>' + feedbackText;

      updateScore();
    };

    updateScore();
  </script>
</body>
</html>
