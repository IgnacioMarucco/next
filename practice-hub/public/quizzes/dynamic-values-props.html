<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Values & Props</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 60px;
      padding-bottom: 40px;
      line-height: 1.6;
    }
    .score-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .badge-score { background: #3b82f6; color: white; }
    .badge-correct { background: var(--success); color: white; }
    .badge-incorrect { background: var(--danger); color: white; }
    
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .quiz-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .quiz-header h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .quiz-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.95rem;
    }
    .question-body {
      font-size: 1rem;
      color: var(--text);
    }
    .question-body pre, .option-label pre {
      background: #060911;
      border: 1px solid #1e293b;
      padding: 0.75rem;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      margin: 0.5rem 0;
      overflow-x: auto;
    }
    .question-body code, .option-label code {
      font-family: 'Fira Code', monospace;
      background: rgba(0,0,0,0.3);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #fbbf24;
      font-size: 0.9em;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: #0c1322;
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-item:hover {
      border-color: var(--accent);
      background: #111a2e;
    }
    .option-item input[type="radio"] {
      margin-top: 0.25rem;
      cursor: pointer;
      accent-color: var(--accent);
      width: 1.1rem;
      height: 1.1rem;
    }
    .option-label {
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .option-item.correct {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
    }
    .option-item.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-bg) !important;
    }
    .btn-submit {
      align-self: flex-start;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
    }
    .feedback-box {
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.pass {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .feedback-box.fail {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="score-bar">
    <div>📊 <span id="quiz-title-nav"></span></div>
    <div class="score-badge">
      <span class="badge badge-score" id="score-text">Score: 0%</span>
      <span class="badge badge-correct" id="correct-text">Correct: 0</span>
      <span class="badge badge-incorrect" id="incorrect-text">Incorrect: 0</span>
    </div>
  </div>

  <div class="container">
    <div class="quiz-header">
      <h1 id="quiz-title-main"></h1>
      <p id="quiz-desc"></p>
    </div>

    <div id="questions-container" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
  </div>

  <script>
    const rawQuizData = {"quiz_id":6038710,"quiz_description":null,"quiz_title":"Dynamic Values & Props","pass_percent":null,"questions":[{"_class":"assessment","id":68704946,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which syntax can be used to output dynamic values /&nbsp;JavaScript expressions in JSX?</p>","relatedLectureIds":"","feedbacks":["That's wrong. Using square brackets in your JSX code will simply display some square brackets on the screen.","That's wrong. Using parentheses in your JSX code will simply display some parentheses on the screen.","That's correct!","That's wrong. Unlike in some other frameworks or libraries, only a single pair of curly braces is needed."],"answers":["<p>[ ] (Square brackets)</p>","<p>( )&nbsp;(Parentheses)</p>","<p>{ } (Curly braces)</p>","<p>{{ }} (Double curly braces)</p>"]},"correct_response":["c"],"section":"","question_plain":"Which syntax can be used to output dynamic values /&nbsp;JavaScript expressions in JSX?","related_lectures":[]},{"_class":"assessment","id":68705040,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which values can be output as dynamic values in JSX (i.e., between curly braces)?</p>","relatedLectureIds":"","feedbacks":["That's wrong. JavaScript statements like function definitions, if-statements etc. can't bet used as part of your JSX code / between curly braces in JSX code.","That's wrong - there is no such thing as a \"React template\" or \"React template instruction\".","That's correct. You could output expressions like \"1 + 1\", variables / constants that hold values, the result of calling a function etc.","That's wrong - there is no such thing as a \"React template\" or \"React template expression\"."],"answers":["<p>Any valid JavaScript statement</p>","<p>Any valid React template instruction</p>","<p>Any valid JavaScript expression</p>","<p>Any valid React template expression</p>"]},"correct_response":["c"],"section":"","question_plain":"Which values can be output as dynamic values in JSX (i.e., between curly braces)?","related_lectures":[]},{"_class":"assessment","id":68705258,"assessment_type":"multiple-choice","prompt":{"question":"<p>How should you typically load /&nbsp;use images in React projects?</p>","relatedLectureIds":"","feedbacks":["That's wrong. Whilst this might work in some projects during development, chances are high that the paths would be incorrect after building the project for production and deploying it.","That's correct. By \"importing\" the image, a production-safe path gets generated under the hood.","That's wrong. Whilst this might work in some projects during development, chances are high that the paths would be incorrect after building the project for production and deploying it.","That's wrong. You can't set the image as a value."],"answers":["<p>Set the &lt;img&gt;&nbsp;src equal to a relative string path to the image</p>","<p>Set the &lt;img&gt;&nbsp;src equal to the path generated via an import statement (that points at the image)</p>","<p>Set the &lt;img&gt;&nbsp;src equal to an absolute string path to the image</p>","<p>Set the &lt;img&gt;&nbsp;src equal to the image itself</p>"]},"correct_response":["b"],"section":"","question_plain":"How should you typically load /&nbsp;use images in React projects?","related_lectures":[]},{"_class":"assessment","id":68705292,"assessment_type":"multiple-choice","prompt":{"question":"<p>How can you assign a dynamic value to an HTML&nbsp;element attribute?</p>","relatedLectureIds":"","feedbacks":["That's correct. You simply replace the text value you would normally set for attributes with the dynamic (curly-brace-wrapped) value.","That's wrong - there is no such thing as a \"directive\" in React projects. There is no special attribute syntax or feature.","That's wrong. The idea is to set a dynamic value, not some hard-coded string","That's wrong - there is no such thing as a \"React template\" and no special attribute syntax."],"answers":["<p>Via the same syntax you use for dynamic values in JSX in general:&nbsp;Curly braces</p>","<p>Via the special React attribute directive that can be added to all built-in and custom components</p>","<p>Via the same syntax you use for attributes in general:&nbsp;You set the value as a hard-coded string</p>","<p>Via the special React template attribute syntax that allows you to store dynamic values for attributes</p>"]},"correct_response":["a"],"section":"","question_plain":"How can you assign a dynamic value to an HTML&nbsp;element attribute?","related_lectures":[]},{"_class":"assessment","id":68705308,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which core React concept can increase the reusability of React components?</p>","relatedLectureIds":"","feedbacks":["That's wrong. JSX is definitely an important concept (especially for components) but it's not increasing the reusability.","That's wrong. Classes don't have anything to do with that.","That's wrong. Components are indeed defined as functions but that's true for all components - no matter how reusable they may be.","That's correct! Props are essentially custom attributes that can be set on components."],"answers":["<p>JSX</p>","<p>Classes</p>","<p>Functions</p>","<p>Props</p>"]},"correct_response":["d"],"section":"","question_plain":"Which core React concept can increase the reusability of React components?","related_lectures":[]},{"_class":"assessment","id":68705676,"assessment_type":"multiple-choice","prompt":{"question":"<p>How do \"props\"&nbsp;work in React?</p>","relatedLectureIds":"","feedbacks":["That's wrong, props can be set as described but they're not output in the JSX code automatically.","That's correct! React automatically passes a props object as the first argument to the receiving component","That's wrong - props can be set as described but they are not set as constants thereafter. Instead, they are received as a parameter (an object)","That's wrong, there is no \"getProps()\" function"],"answers":["<p>You can set props (\"custom attributes\") on components to automatically output them in the component's JSX&nbsp;code</p>","<p>You can set props (\"custom attributes\") on components to then extract &amp; use them in the receiving component</p>","<p>You can set props (\"custom attributes\") on components which then receive them as automatically provided constants in the function body</p>","<p>You can set props (\"custom attributes\") on components which can then call a getProps() function to extract the received values</p>"]},"correct_response":["b"],"section":"","question_plain":"How do \"props\"&nbsp;work in React?","related_lectures":[]},{"_class":"assessment","id":68706140,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which of the following four code examples for setting &amp;&nbsp;extracting props would NOT&nbsp;work as intended?</p><p><em>I.e., which example will NOT&nbsp;output the text \"Priority: 5\" on the screen.</em></p>","relatedLectureIds":"","feedbacks":["That's not the right choice. This syntax might look weird (and indeed also is unnecessarily complicated) but it would work. You can use \"Rest properties\" to group properties that have not been \"pulled out\" via destructuring into a new object (\"props\" in this case). So the \"priority\" prop could be extracted from the props object as shown.","That's not the right choice. React automatically passes a \"props\" object as a first argument to the component function. This object contains all props (\"custom attributes\") as key-value pairs (i.e., as properties). So accessing \"priority\" on \"props\" will work","That's not the right choice. This example will work as React automatically passed an object with all \"custom attributes\" as a first argument to the component function. Object destructuring can then be used as shown in this example to \"pull out\" the props the component needs.","That's the right choice. The error is subtle but this example does NOT use object destructuring. So here, the \"priority\" prop is not pulled out of the props object. Instead, it's now the entire props object that's named \"priority\". This wouldn't be a problem since the name is up to you. But it's now the entire object that's output in the paragraph, not the \"priority\" property. Therefore, the output would not be \"Priority: 5\" but instead \"Priority: [Object object]\" (or something like that)."],"answers":["<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent({...props}) {\n  return &lt;p&gt;Priority:&nbsp;{props.priority}&lt;/p&gt;\n}</pre>","<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent(props) {\n  return &lt;p&gt;Priority:&nbsp;{props.priority}&lt;/p&gt;\n}</pre>","<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent({priority}) {\n  return &lt;p&gt;Priority:&nbsp;{priority}&lt;/p&gt;\n}</pre>","<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent(priority) {\n  return &lt;p&gt;Priority:&nbsp;{priority}&lt;/p&gt;\n}</pre>"]},"correct_response":["d"],"section":"","question_plain":"Which of the following four code examples for setting &amp;&nbsp;extracting props would NOT&nbsp;work as intended?I.e., which example will NOT&nbsp;output the text \"Priority: 5\" on the screen.","related_lectures":[]}]};
    const questions = rawQuizData.questions || [];
    const userAnswers = new Map(); // questionIndex -> { selectedIndex, isCorrect }

    document.getElementById('quiz-title-nav').textContent = rawQuizData.quiz_title || 'Quiz';
    document.getElementById('quiz-title-main').textContent = rawQuizData.quiz_title || 'React Quiz';
    document.getElementById('quiz-desc').textContent = rawQuizData.quiz_description || 'Select the correct answer for each question below and click Submit.';

    function updateScore() {
      let correct = 0;
      let incorrect = 0;
      userAnswers.forEach((ans) => {
        if (ans.isCorrect) correct++;
        else incorrect++;
      });
      const answered = correct + incorrect;
      const pct = answered > 0 ? ((correct / questions.length) * 100).toFixed(1) : 0;

      document.getElementById('score-text').textContent = 'Score: ' + pct + '% (' + correct + '/' + questions.length + ')';
      document.getElementById('correct-text').textContent = 'Correct: ' + correct;
      document.getElementById('incorrect-text').textContent = 'Incorrect: ' + incorrect;
    }

    const container = document.getElementById('questions-container');

    questions.forEach((q, qIndex) => {
      const qPrompt = q.prompt || {};
      const answers = qPrompt.answers || [];
      const feedbacks = qPrompt.feedbacks || [];
      const correctChar = (q.correct_response && q.correct_response[0]) ? q.correct_response[0].toLowerCase() : 'a';
      const correctIndex = correctChar.charCodeAt(0) - 97;

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'question-' + qIndex;

      let optionsHtml = '';
      answers.forEach((ans, aIndex) => {
        const optionId = 'q_' + qIndex + '_opt_' + aIndex;
        optionsHtml += `
          <label class="option-item" id="item_${qIndex}_${aIndex}" for="${optionId}">
            <input type="radio" name="q_${qIndex}" id="${optionId}" value="${aIndex}" />
            <div class="option-label">${ans}</div>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="question-top">
          <span>Question ${qIndex + 1} of ${questions.length}</span>
        </div>
        <div class="question-body">${qPrompt.question || ''}</div>
        <div class="options-list">${optionsHtml}</div>
        <button class="btn-submit" onclick="submitQuestion(${qIndex}, ${correctIndex})">Submit Answer</button>
        <div class="feedback-box" id="feedback-${qIndex}"></div>
      `;

      container.appendChild(card);
    });

    window.submitQuestion = function(qIndex, correctIndex) {
      const selected = document.querySelector('input[name="q_' + qIndex + '"]:checked');
      if (!selected) {
        alert('Please select an option first!');
        return;
      }

      const selectedIndex = parseInt(selected.value, 10);
      const isCorrect = selectedIndex === correctIndex;
      userAnswers.set(qIndex, { selectedIndex, isCorrect });

      const q = questions[qIndex];
      const feedbacks = (q.prompt && q.prompt.feedbacks) ? q.prompt.feedbacks : [];
      const feedbackText = feedbacks[selectedIndex] || (isCorrect ? "Correct answer!" : "Incorrect answer.");

      // Visual classes
      const card = document.getElementById('question-' + qIndex);
      const options = card.querySelectorAll('.option-item');
      options.forEach((opt, idx) => {
        opt.classList.remove('correct', 'incorrect');
        if (idx === correctIndex) opt.classList.add('correct');
        else if (idx === selectedIndex && !isCorrect) opt.classList.add('incorrect');
      });

      const feedbackBox = document.getElementById('feedback-' + qIndex);
      feedbackBox.className = 'feedback-box show ' + (isCorrect ? 'pass' : 'fail');
      feedbackBox.innerHTML = '<strong>' + (isCorrect ? '✅ Correct! ' : '❌ Incorrect. ') + '</strong>' + feedbackText;

      updateScore();
    };

    updateScore();
  </script>
</body>
</html>
