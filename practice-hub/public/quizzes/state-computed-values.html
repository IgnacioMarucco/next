<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>State & Computed Values</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 60px;
      padding-bottom: 40px;
      line-height: 1.6;
    }
    .score-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .badge-score { background: #3b82f6; color: white; }
    .badge-correct { background: var(--success); color: white; }
    .badge-incorrect { background: var(--danger); color: white; }
    
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .quiz-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .quiz-header h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .quiz-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.95rem;
    }
    .question-body {
      font-size: 1rem;
      color: var(--text);
    }
    .question-body pre, .option-label pre {
      background: #060911;
      border: 1px solid #1e293b;
      padding: 0.75rem;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      margin: 0.5rem 0;
      overflow-x: auto;
    }
    .question-body code, .option-label code {
      font-family: 'Fira Code', monospace;
      background: rgba(0,0,0,0.3);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #fbbf24;
      font-size: 0.9em;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: #0c1322;
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-item:hover {
      border-color: var(--accent);
      background: #111a2e;
    }
    .option-item input[type="radio"] {
      margin-top: 0.25rem;
      cursor: pointer;
      accent-color: var(--accent);
      width: 1.1rem;
      height: 1.1rem;
    }
    .option-label {
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .option-item.correct {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
    }
    .option-item.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-bg) !important;
    }
    .btn-submit {
      align-self: flex-start;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
    }
    .feedback-box {
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.pass {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .feedback-box.fail {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="score-bar">
    <div>📊 <span id="quiz-title-nav"></span></div>
    <div class="score-badge">
      <span class="badge badge-score" id="score-text">Score: 0%</span>
      <span class="badge badge-correct" id="correct-text">Correct: 0</span>
      <span class="badge badge-incorrect" id="incorrect-text">Incorrect: 0</span>
    </div>
  </div>

  <div class="container">
    <div class="quiz-header">
      <h1 id="quiz-title-main"></h1>
      <p id="quiz-desc"></p>
    </div>

    <div id="questions-container" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
  </div>

  <script>
    const rawQuizData = {"quiz_id":6038726,"quiz_description":null,"quiz_title":"State & Computed Values","pass_percent":null,"questions":[{"_class":"assessment","id":68904264,"assessment_type":"multiple-choice","prompt":{"question":"<p>What's the purpose of \"State\"&nbsp;in React apps?</p>","relatedLectureIds":"","feedbacks":["That's wrong - that's the \"props\" concept","That's correct! The component to which the state belongs and its child and descendent components will be re-evaluated as state changes.","That's wrong. Only the component to which the state belongs AND all descendent components will be re-evaluated. Not ALL components in the app.","That's wrong. You can (and often will) pass state values to other components - no matter if the state changed or not."],"answers":["<p>It's data that's passed to other components</p>","<p>It's data that, when changed, causes React to re-evaluate a component</p>","<p>It's data that, when changed, always causes React to re-evaluate all components in the app</p>","<p>It's data that, when changed, can't be passed to components anymore</p>"]},"correct_response":["b"],"section":"","question_plain":"What's the purpose of \"State\"&nbsp;in React apps?","related_lectures":[]},{"_class":"assessment","id":68904326,"assessment_type":"multiple-choice","prompt":{"question":"<p>There are two \"Rules of Hooks\".</p><p>Which of the following statements is NOT&nbsp;TRUE according to those rules?</p>","relatedLectureIds":"","feedbacks":["That's the right choice because this statement is false - you ARE ALLOWED to call as many Hook function as needed. And they may (and often will) be positioned directly next to each other.","That's the wrong choice because this statement is covered by those rules. You are not allowed to use React Hooks outside of component functions (or custom hooks, which will be covered later - but those also end up in component functions in the end).","That's the wrong choice because this statement is covered by those rules. You are not allowed to call React Hooks inside of if statement.","That's the wrong choice because this statement is covered by those rules. You are not allowed to call React Hooks inside of nested functions."],"answers":["<p>You must not call React Hooks next to other Hooks.</p>","<p>You must not call React Hooks outside of the component function.</p>","<p>You must not call React Hooks inside of if statements.</p>","<p>You must not call React Hooks inside of nested functions.</p>"]},"correct_response":["a"],"section":"","question_plain":"There are two \"Rules of Hooks\".Which of the following statements is NOT&nbsp;TRUE according to those rules?","related_lectures":[]},{"_class":"assessment","id":68904356,"assessment_type":"multiple-choice","prompt":{"question":"<p>Will the following code work?</p><pre class=\"prettyprint linenums\">import { useState } from 'react';\n\nfunction SomeComponent() {\n  const [selected, setSelected] =&nbsp;useState(false);\n\n  function handleClick() {\n    const [selected, setSelected] =&nbsp;useState(true);\n  }\n\n  return &lt;button onClick={handleClick}&gt;Select&lt;/button&gt;\n}</pre>","relatedLectureIds":"","feedbacks":["That's the correct choice. This code violates the \"Rules of Hooks\" as it calls a Hook function inside of a nested function.","That's wrong - this code won't work. It violates the \"Rules of Hooks\" as it calls a Hook function inside of a nested function.","That's wrong - this code won't work. It violates the \"Rules of Hooks\" as it calls a Hook function inside of a nested function. It doesn't matter if SomeComponent is used in some other component or not."],"answers":["<p>No</p>","<p>Yes</p>","<p>Yes, if no SomeComponent is not nested into some other component</p>"]},"correct_response":["a"],"section":"","question_plain":"Will the following code work?import { useState } from 'react';\n\nfunction SomeComponent() {\n  const [selected, setSelected] =&nbsp;useState(false);\n\n  function handleClick() {\n    const [selected, setSelected] =&nbsp;useState(true);\n  }\n\n  return &lt;button onClick={handleClick}&gt;Select&lt;/button&gt;\n}","related_lectures":[]},{"_class":"assessment","id":68904416,"assessment_type":"multiple-choice","prompt":{"question":"<p>What's the idea behind \"derived state\"&nbsp;/&nbsp;\"computed values\"?</p>","relatedLectureIds":"","feedbacks":["That's wrong - you absolutely should use computed values / derived state whenever possible.","That's wrong, the idea is to NOT manage them as extra state.","That's correct. "],"answers":["<p>It's an older pattern that shouldn't be used anymore - use state instead.</p>","<p>Computed values are values that should be managed as separate state which is then derived from other state values.</p>","<p>Computed values are values that shouldn't be managed as separate state since they can be derived from other state.</p>"]},"correct_response":["c"],"section":"","question_plain":"What's the idea behind \"derived state\"&nbsp;/&nbsp;\"computed values\"?","related_lectures":[]}]};
    const questions = rawQuizData.questions || [];
    const userAnswers = new Map(); // questionIndex -> { selectedIndex, isCorrect }

    document.getElementById('quiz-title-nav').textContent = rawQuizData.quiz_title || 'Quiz';
    document.getElementById('quiz-title-main').textContent = rawQuizData.quiz_title || 'React Quiz';
    document.getElementById('quiz-desc').textContent = rawQuizData.quiz_description || 'Select the correct answer for each question below and click Submit.';

    function updateScore() {
      let correct = 0;
      let incorrect = 0;
      userAnswers.forEach((ans) => {
        if (ans.isCorrect) correct++;
        else incorrect++;
      });
      const answered = correct + incorrect;
      const pct = answered > 0 ? ((correct / questions.length) * 100).toFixed(1) : 0;

      document.getElementById('score-text').textContent = 'Score: ' + pct + '% (' + correct + '/' + questions.length + ')';
      document.getElementById('correct-text').textContent = 'Correct: ' + correct;
      document.getElementById('incorrect-text').textContent = 'Incorrect: ' + incorrect;
    }

    const container = document.getElementById('questions-container');

    questions.forEach((q, qIndex) => {
      const qPrompt = q.prompt || {};
      const answers = qPrompt.answers || [];
      const feedbacks = qPrompt.feedbacks || [];
      const correctChar = (q.correct_response && q.correct_response[0]) ? q.correct_response[0].toLowerCase() : 'a';
      const correctIndex = correctChar.charCodeAt(0) - 97;

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'question-' + qIndex;

      let optionsHtml = '';
      answers.forEach((ans, aIndex) => {
        const optionId = 'q_' + qIndex + '_opt_' + aIndex;
        optionsHtml += `
          <label class="option-item" id="item_${qIndex}_${aIndex}" for="${optionId}">
            <input type="radio" name="q_${qIndex}" id="${optionId}" value="${aIndex}" />
            <div class="option-label">${ans}</div>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="question-top">
          <span>Question ${qIndex + 1} of ${questions.length}</span>
        </div>
        <div class="question-body">${qPrompt.question || ''}</div>
        <div class="options-list">${optionsHtml}</div>
        <button class="btn-submit" onclick="submitQuestion(${qIndex}, ${correctIndex})">Submit Answer</button>
        <div class="feedback-box" id="feedback-${qIndex}"></div>
      `;

      container.appendChild(card);
    });

    window.submitQuestion = function(qIndex, correctIndex) {
      const selected = document.querySelector('input[name="q_' + qIndex + '"]:checked');
      if (!selected) {
        alert('Please select an option first!');
        return;
      }

      const selectedIndex = parseInt(selected.value, 10);
      const isCorrect = selectedIndex === correctIndex;
      userAnswers.set(qIndex, { selectedIndex, isCorrect });

      const q = questions[qIndex];
      const feedbacks = (q.prompt && q.prompt.feedbacks) ? q.prompt.feedbacks : [];
      const feedbackText = feedbacks[selectedIndex] || (isCorrect ? "Correct answer!" : "Incorrect answer.");

      // Visual classes
      const card = document.getElementById('question-' + qIndex);
      const options = card.querySelectorAll('.option-item');
      options.forEach((opt, idx) => {
        opt.classList.remove('correct', 'incorrect');
        if (idx === correctIndex) opt.classList.add('correct');
        else if (idx === selectedIndex && !isCorrect) opt.classList.add('incorrect');
      });

      const feedbackBox = document.getElementById('feedback-' + qIndex);
      feedbackBox.className = 'feedback-box show ' + (isCorrect ? 'pass' : 'fail');
      feedbackBox.innerHTML = '<strong>' + (isCorrect ? '✅ Correct! ' : '❌ Incorrect. ') + '</strong>' + feedbackText;

      updateScore();
    };

    updateScore();
  </script>
</body>
</html>
