<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz</title>
        <style>
            * {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
                    "Open Sans", "Helvetica Neue", sans-serif;
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-size: 16px;
            }

            main {
                padding-top: 48px;
            }

            :root {
                --large-device-width: 850px;
                --primary-color: #0f172a;
                --secondary-color: #020617;
                --primary-text-color: #c7d1dd;
                --secondary-text-color: #061602;
                --success-background: hsl(159, 82%, 24%);
                --success-foreground: hsl(164, 86%, 16%);
                --success: hsl(160, 84%, 39%);
                --danger: #ef4444;
                --warning: #f59e0b;
                --info-background: hsl(218, 81%, 8%);
                --info-foreground: hsl(217, 91%, 85%);
                --border-color: #d1d7dc;
                --check-box-size: 20px;
                /* control the size */
                --check-box-color: var(--info-foreground);
                /* the active color */
            }

            body {
                position: relative;
                background-color: #020617;
                color: var(--primary-text-color);
            }

            #score-stats-container {
                position: fixed;
                z-index: 10;
                top: 0;
                height: 40px;
                width: 100%;
                background-color: var(--info-background);

                padding: 0px 16px;
                color: var(--info-foreground);
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            #quiz-container {
                border-radius: 8px;
                display: flex;
                gap: 16px;
                flex-direction: column;
            }

            input[type="radio"] {
                height: var(--check-box-size);
                aspect-ratio: 1;
                border: calc(var(--check-box-size) / 8) solid #939393;
                padding: calc(var(--check-box-size) / 8);
                background: radial-gradient(farthest-side, var(--check-box-color) 94%, #0000) 50%/0 0 no-repeat
                    content-box;
                border-radius: 50%;
                outline-offset: calc(var(--check-box-size) / 10);
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                cursor: pointer;
                font-size: inherit;
                transition: 0.3s;
            }

            input[type="radio"]:checked {
                border-color: var(--check-box-color);
                background-size: 100% 100%;
            }

            input[type="radio"]:disabled {
                background: linear-gradient(#939393 0 0) 50%/100% 20% no-repeat content-box;
                opacity: 0.5;
                cursor: not-allowed;
            }

            label {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                padding: 4px 6px;
                border-radius: 4px;
            }

            @media (max-width: 767px) {
                input[type="radio"],
                label {
                    cursor: default;
                }

                #quiz-container {
                    margin-left: 8px;
                    margin-right: 8px;
                }
            }

            /* PC (Desktop devices) */
            @media (min-width: 768px) {
                body {
                    display: flex;
                    justify-content: center;
                }

                main {
                    max-width: var(--large-device-width);
                }

                #score-stats-container {
                    max-width: var(--large-device-width);
                }

                dialog {
                    max-width: var(--large-device-width);
                }
            }

            @media print {
                input[type="radio"] {
                    background: none !important;
                    border-color: #939393 !important;
                }

                input[type="radio"]:checked {
                    border-color: #939393 !important;
                }
            }

            .question-lable {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            button {
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                outline: none;
                position: relative;
                overflow: hidden;
                cursor: pointer;
            }

            .button {
                background-color: var(--success-background);
                border: none;
                color: #f4f5f7;
                opacity: 0.8;
                font-size: 18px;
                flex-grow: 1;
                padding: 8px 16px;
                border-radius: 8px;
            }

            .button:hover {
                opacity: 1;
            }

            .explanation-btn {
                border: none;
                color: var(--success);
                background-color: transparent;
            }

            #submit-button:active::after {
                background-color: #ef4444;
            }

            .single-question-container {
                background-color: var(--primary-color);
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 16px;
                border-radius: 8px;
            }

            #modal-content {
                padding: 16px;
                line-height: 24px;
            }

            dialog::backdrop {
                background: rgba(0, 0, 0, 0.5);
            }

            dialog {
                position: fixed;
                border: 1px solid var(--border-color);
                background-color: var(--primary-color);
                color: rgb(240, 241, 248);
                padding: 16px;
                border-radius: 8px;
                width: 80vw;
                max-height: 80vh;
                overflow: auto;
                top: 50%;
                left: 50%;
                -webkit-transform: translateX(-50%) translateY(-50%);
                -moz-transform: translateX(-50%) translateY(-50%);
                -ms-transform: translateX(-50%) translateY(-50%);
                transform: translateX(-50%) translateY(-50%);
            }

            #close-modal-btn {
                position: absolute;
                top: 4px;
                right: 4px;
                padding: 2px 8px;
                border-radius: 2px;
                border: none;
                background-color: var(--danger);
            }

            .correct-answer label {
                border: 2px solid var(--success);
                width: 100%;
            }

            .incorrect-answer label {
                border: 2px solid var(--danger);
                width: 100%;
            }

            .options-container {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            #quiz-meta-container {
                border-radius: 8px;
                background-color: var(--primary-color);
                margin-bottom: 12px;
                padding: 8px;
            }

            #quiz-title {
                text-align: center;
                font-size: 24px;
                margin-bottom: 8px;
            }

            #quiz-description {
                line-height: 1.5;
                padding: 2px 6px;
            }
        </style>
    </head>

    <body onload="main()">
        <main>
            <section id="quiz-meta-container">
                <h1 id="quiz-title"></h1>
                <p id="quiz-description"></p>
            </section>
            <section id="score-stats-container">
                <div id="score-card">
                    Score: <span id="current-score">999</span> of
                    <span id="pass-percent">999%</span>
                </div>
                <div>Correct: <span id="correct-answers">999</span></div>
                <div>Incorrect: <span id="wrong-answers">999</span></div>
            </section>

            <section id="quiz-container"></section>

            <dialog id="modal" class="modal-container">
                <div id="modal-content">
                    <p id="modal-text"></p>
                </div>
            </dialog>
        </main>

        <script>
            const quizData = {"quiz_id": 6038702, "quiz_description": null, "quiz_title": "Components & JSX", "pass_percent": null, "questions": [{"_class": "assessment", "id": 68658750, "assessment_type": "multiple-choice", "prompt": {"question": "<p>From the perspective of a developer:&nbsp;What's one advantage of building a user interface by combining components?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. Whilst you will later learn about techniques that allow you to improve application performance, components on their own do NOT provide a performance benefit. The overall app is the same, no matter if you split it into components or not.", "That's correct! As a developer, it's typically easier to work on smaller, more manageable building blocks. In addition, if a certain building block must be used in different parts of the UI, you can simply reuse it (instead of copying &amp; pasting it) if built as a component.", "That's wrong. Components are a nice (and important!) feature but they do not unlock some kind of \"more powerful features\". You can use the same React and web dev features, no matter if you're using components or not.", "That's wrong. Because whilst you could argue that by using components, it's easier to build complex / advanced websites, components are not required to build such websites. They might make it easier but they're not a prerequisite."], "answers": ["<p>Better performance</p>", "<p>Small, reusable building blocks</p>", "<p>More powerful features</p>", "<p>Can build advanced websites</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "From the perspective of a developer:&nbsp;What's one advantage of building a user interface by combining components?", "related_lectures": []}, {"_class": "assessment", "id": 68658806, "assessment_type": "multiple-choice", "prompt": {"question": "<p>When working with React: How is a new component defined?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. That's how you would USE a custom component - but it's now how you DEFINE it.", "That's wrong. Custom components do indeed typically use JSX code and they are also typically used inside of JSX code but they're not DEFINED just by using JSX code.", "That's correct! A component, in React, is simply a function that returns renderable content - typically JSX code. After being defined, a custom component can be used like a built-in HTML element inside of other components' JSX code.", "That's wrong. There is no such function in the React library."], "answers": ["<p>By adding a custom element like &lt;Header /&gt; to your HTML&nbsp;code</p>", "<p>By using JSX in your code files</p>", "<p>By creating a function that returns JSX&nbsp;code</p>", "<p>By using React's createComponent() function</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "When working with React: How is a new component defined?", "related_lectures": []}, {"_class": "assessment", "id": 68658938, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What's the purpose of JSX?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. Whilst you will typically use your components in JSX code, JSX is actually not a prerequisite. It's also not required to create custom components - instead that's done by creating a JavaScript function.", "That's wrong. JSX is used a lot in React but you could use React without JSX.", "That's wrong. JSX is used a lot in React but you could use React without JSX.", "That's correct. The idea behind JSX is that you have an easier time defining the target HTML code that should be generated by your components."], "answers": ["<p>It allows you to create custom components and elements</p>", "<p>It allows you to work with React and components</p>", "<p>It's required by React</p>", "<p>It allows you to define the target HTML&nbsp;code inside of your components</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "What's the purpose of JSX?", "related_lectures": []}, {"_class": "assessment", "id": 68658974, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which statement about JSX is TRUE?</p>", "relatedLectureIds": "", "feedbacks": ["That's correct. JSX allows you to define the target UI / HTML code right inside your JavaScript code - and therefore right inside your components.", "That's wrong. You can also output built-in components.", "That's wrong. JSX code is not a native JavaScript feature and therefore won't work in browsers.", "That's wrong. The core idea behind JSX is to use HTML-like code in JavaScript files. HTML is HTML."], "answers": ["<p>JSX code is used to define the target UI /&nbsp;HTML&nbsp;code</p>", "<p>JSX&nbsp;code can only be used to output custom components</p>", "<p>JSX code would run in the browser</p>", "<p>JSX&nbsp;code must be stored in <code>.html</code> files</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "Which statement about JSX is TRUE?", "related_lectures": []}, {"_class": "assessment", "id": 68659000, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What does React do with the components you use in the JSX&nbsp;code?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. React does not generate any HTML file.", "That's correct. Your JSX code leads to a tree-like code structure that \"tells\" React how the different components are related and how the UI should look like. It then executes appropriate commands to manipulate the real DOM to reflect that target structure / code.", "That's wrong. React does not derive or generate any HTML file", "That's wrong. React does not derive or generate any HTML file"], "answers": ["<p>It generates a HTML&nbsp;file that's then served by the browser</p>", "<p>It derives a component tree that's then used to perform commands that update the website DOM</p>", "<p>It derives a HTML&nbsp;file that's then used to perform commands that update the website DOM</p>", "<p>It generates a component tree that's then translated to an HTML&nbsp;file</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "What does React do with the components you use in the JSX&nbsp;code?", "related_lectures": []}, {"_class": "assessment", "id": 68659104, "assessment_type": "multiple-choice", "prompt": {"question": "<p>How do you typically use custom components?</p>", "relatedLectureIds": "", "feedbacks": ["That's correct!", "That's wrong. You never call component functions directly. Instead, React will do that for you.", "That's wrong. Whilst you will indeed use ReactDOM's render() method to render the root component of your app, you'll not use that method to output all your custom components.", "That's wrong. You never use your components like HTML code in any HTML file. They wouldn't work there."], "answers": ["<p>You use custom components like HTML&nbsp;elements inside of JSX code</p>", "<p>You call the custom component functions inside of other component functions</p>", "<p>You pass the custom component functions as identifiers to ReactDOM's <code>render()</code> method</p>", "<p>You use custom components in the <code>index.html</code> or any other HTML&nbsp;file</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "How do you typically use custom components?", "related_lectures": []}, {"_class": "assessment", "id": 68706502, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which statement about custom components is FALSE?</p>", "relatedLectureIds": "", "feedbacks": ["That's the wrong choice because this statement is right. Custom components are created by simply defining a JavaScript function", "That's the wrong choice because this statement is right. To use custom components in JSX code, their name must start with an uppercase character. That's how React tells them apart from built-in components / elements.", "That's the wrong choice because this statement is right. Custom components do indeed need to return renderable content.", "That's the right choice because this statement is WRONG. You can define custom components wherever you want."], "answers": ["<p>Custom components can be created as JavaScript functions</p>", "<p>To use custom components in JSX, they must start with an uppercase character</p>", "<p>Custom components must return renderable content (typically JSX)</p>", "<p>Custom components must be defined next to the components that want to use them</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "Which statement about custom components is FALSE?", "related_lectures": []}]};
            let correct = new Set();
            let incorrect = new Set();
            let totalNumberOfQuestions = 0;
            const quizTitle = quizData.quiz_title;
            const quizDescription = quizData.quiz_description;
            const questionData = quizData.questions;
            const passPercent = quizData.pass_percent;
            const modalTextElement = document.getElementById("modal-text");
            const quizContainerElement = document.getElementById("quiz-container");

            const dialog = document.querySelector("dialog");
            const showButton = document.getElementById("view-explanatin");
            const closeButton = document.getElementById("close-modal-btn");
            const quizTitleElement = document.getElementById("quiz-title");
            const quizDescriptionElement = document.getElementById("quiz-description");

            function main() {
                // update quiz meta data
                document.title = quizTitle;
                quizTitleElement.innerHTML = quizTitle;
                quizDescriptionElement.innerHTML = quizDescription;

                const passPercentElement = document.getElementById("pass-percent");
                passPercentElement.innerHTML = passPercent + "%";
                totalNumberOfQuestions = questionData.length;
                // shuffle the questionData to randomize the order of the questions
                for (let i = questionData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questionData[i], questionData[j]] = [questionData[j], questionData[i]];
                }

                let formattedQuestions = questionData.map(formatSingleQuestionData);
                updateScore();
                // display the formattedQuestions
                formattedQuestions.forEach((question, idx) => {
                    renderSingleQuestion(question, idx + 1);
                });
            }

            /**
             * Formats the question data from the given QuizData object.
             *
             * @param {Object} singleQuizData - The singleQuizData object containing prompt and correct_response.
             * @return {Object} The formatted question object with the following properties:
             *   - id: The ID of the question.
             *   - question: The text of the question.
             *   - answers: The array of answer options.
             *   - correctAnswer: The text of the correct answer.
             *   - explanation: The explanation of the correct answer.
             */
            function formatSingleQuestionData(singleQuizData = null) {
                const { prompt, correct_response, id } = singleQuizData;
                const questionText = prompt.question;
                const answers = prompt.answers;
                const correctAnswer = correct_response[0];
                const correctAnswerText = answers[correctAnswer.toLowerCase().charCodeAt(0) - 97];
                const questionObj = {
                    id: id,
                    question: questionText,
                    answers: answers,
                    correctAnswer: correctAnswerText,
                    explanation: prompt?.explanation || "",
                };
                return questionObj;
            }

            /**
             * Renders a single question with its options and submit button.
             *
             * @param {Object} singleQuestionData - The data of the question to render.
             * @param {number} rootIndex - The index of the question in the quiz.
             * @return {void} return nothing.
             */

            const renderSingleQuestion = (singleQuestionData = {}, rootIndex = 1) => {
                const { id, explanation, answers, correctAnswer, question } = singleQuestionData;
                // shuffle the answers to randomize the order of the answers
                for (let i = answers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [answers[i], answers[j]] = [answers[j], answers[i]];
                }
                const optionsHTML = answers
                    .map((option, index) => {
                        const optionId = `${id}_${index}`;

                        return `
        <div class="question-lable">
          <input type="radio" id="${optionId}" name="${"answer"}" value="${option}" />
          <label for="${optionId}">${option}</label>
        </div>
      `;
                    })

                    .join("");

                const container = document.createElement("div");
                container.innerHTML = `
        <form data-correct-answer="${correctAnswer}" data-question-id="${id}" class="single-question-container" onsubmit="submitButtonListener(event)">
          <div style="display: flex;justify-content: space-between;">
            <p style="font-weight: 600">Question ${rootIndex}:</p>
            <button type="button" onclick="renderExplanation(event)" id="${`explanation-${id}`}" data-explanation="${explanation}" class="explanation-btn">View Explanation</button>
          </div>
          <p style="margin-bottom: 8px;line-height: 1.5">${question}</p>
          <div class="options-container">
            ${optionsHTML}
          </div>
          <div style="display: flex; gap: 8px;">
            <button type="submit" id="submit-button" class="button">Submit</button>
          </div>
        </form>
      `;
                quizContainerElement.appendChild(container);
            };

            /**
             * Updates the score on the page based on the number of correct and incorrect answers.
             *
             * @return {void} This function does not return a value.
             */
            function updateScore() {
                const currentParcentageElement = document.getElementById("current-score");
                const correctAnswerElement = document.getElementById("correct-answers");
                const wrongAnswerElement = document.getElementById("wrong-answers");
                correctAnswerElement.innerHTML = correct.size;
                wrongAnswerElement.innerHTML = incorrect.size;
                const score = Number((correct.size / totalNumberOfQuestions) * 100).toFixed(2);
                currentParcentageElement.innerHTML = score;
            }

            /**
             * Handles the event when the submit button is clicked.
             *
             * @param {Event} e - The event object.
             * @return {void} This function does not return anything.
             */
            const submitButtonListener = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const form = e.target;
                const selectedOption = e.target.querySelector('input[type="radio"]:checked');
                if (!selectedOption) {
                    alert("Please select an answer!");
                    return;
                }

                let isCorrect = false;
                const { answer: userAnswer } = Object.fromEntries(formData.entries());
                const correctAnswer = e.target.dataset.correctAnswer;
                const questionId = e.target.dataset.questionId;
                if (userAnswer == correctAnswer) {
                    correct.add(questionId);
                    incorrect.delete(questionId);
                    isCorrect = true;
                } else {
                    incorrect.add(e.target.dataset.questionId);
                    correct.delete(questionId);
                }
                updateScore();

                const resultClass = isCorrect ? "correct-answer" : "incorrect-answer";

                form.querySelectorAll(".question-lable").forEach((label) => {
                    label.classList.remove("correct-answer", "incorrect-answer");
                });
                selectedOption.closest(".question-lable").classList.add(resultClass);
            };

            function renderExplanation(ev) {
                modalTextElement.innerHTML = ev.target.dataset?.explanation || "no explanation found";
                dialog.showModal();
                dialog.addEventListener("click", (event) => {
                    if (event.target === dialog) {
                        dialog.close();
                    }
                });
            }
        </script>
    </body>
</html>
