<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz</title>
        <style>
            * {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
                    "Open Sans", "Helvetica Neue", sans-serif;
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-size: 16px;
            }

            main {
                padding-top: 48px;
            }

            :root {
                --large-device-width: 850px;
                --primary-color: #0f172a;
                --secondary-color: #020617;
                --primary-text-color: #c7d1dd;
                --secondary-text-color: #061602;
                --success-background: hsl(159, 82%, 24%);
                --success-foreground: hsl(164, 86%, 16%);
                --success: hsl(160, 84%, 39%);
                --danger: #ef4444;
                --warning: #f59e0b;
                --info-background: hsl(218, 81%, 8%);
                --info-foreground: hsl(217, 91%, 85%);
                --border-color: #d1d7dc;
                --check-box-size: 20px;
                /* control the size */
                --check-box-color: var(--info-foreground);
                /* the active color */
            }

            body {
                position: relative;
                background-color: #020617;
                color: var(--primary-text-color);
            }

            #score-stats-container {
                position: fixed;
                z-index: 10;
                top: 0;
                height: 40px;
                width: 100%;
                background-color: var(--info-background);

                padding: 0px 16px;
                color: var(--info-foreground);
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            #quiz-container {
                border-radius: 8px;
                display: flex;
                gap: 16px;
                flex-direction: column;
            }

            input[type="radio"] {
                height: var(--check-box-size);
                aspect-ratio: 1;
                border: calc(var(--check-box-size) / 8) solid #939393;
                padding: calc(var(--check-box-size) / 8);
                background: radial-gradient(farthest-side, var(--check-box-color) 94%, #0000) 50%/0 0 no-repeat
                    content-box;
                border-radius: 50%;
                outline-offset: calc(var(--check-box-size) / 10);
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                cursor: pointer;
                font-size: inherit;
                transition: 0.3s;
            }

            input[type="radio"]:checked {
                border-color: var(--check-box-color);
                background-size: 100% 100%;
            }

            input[type="radio"]:disabled {
                background: linear-gradient(#939393 0 0) 50%/100% 20% no-repeat content-box;
                opacity: 0.5;
                cursor: not-allowed;
            }

            label {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                padding: 4px 6px;
                border-radius: 4px;
            }

            @media (max-width: 767px) {
                input[type="radio"],
                label {
                    cursor: default;
                }

                #quiz-container {
                    margin-left: 8px;
                    margin-right: 8px;
                }
            }

            /* PC (Desktop devices) */
            @media (min-width: 768px) {
                body {
                    display: flex;
                    justify-content: center;
                }

                main {
                    max-width: var(--large-device-width);
                }

                #score-stats-container {
                    max-width: var(--large-device-width);
                }

                dialog {
                    max-width: var(--large-device-width);
                }
            }

            @media print {
                input[type="radio"] {
                    background: none !important;
                    border-color: #939393 !important;
                }

                input[type="radio"]:checked {
                    border-color: #939393 !important;
                }
            }

            .question-lable {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            button {
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                outline: none;
                position: relative;
                overflow: hidden;
                cursor: pointer;
            }

            .button {
                background-color: var(--success-background);
                border: none;
                color: #f4f5f7;
                opacity: 0.8;
                font-size: 18px;
                flex-grow: 1;
                padding: 8px 16px;
                border-radius: 8px;
            }

            .button:hover {
                opacity: 1;
            }

            .explanation-btn {
                border: none;
                color: var(--success);
                background-color: transparent;
            }

            #submit-button:active::after {
                background-color: #ef4444;
            }

            .single-question-container {
                background-color: var(--primary-color);
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 16px;
                border-radius: 8px;
            }

            #modal-content {
                padding: 16px;
                line-height: 24px;
            }

            dialog::backdrop {
                background: rgba(0, 0, 0, 0.5);
            }

            dialog {
                position: fixed;
                border: 1px solid var(--border-color);
                background-color: var(--primary-color);
                color: rgb(240, 241, 248);
                padding: 16px;
                border-radius: 8px;
                width: 80vw;
                max-height: 80vh;
                overflow: auto;
                top: 50%;
                left: 50%;
                -webkit-transform: translateX(-50%) translateY(-50%);
                -moz-transform: translateX(-50%) translateY(-50%);
                -ms-transform: translateX(-50%) translateY(-50%);
                transform: translateX(-50%) translateY(-50%);
            }

            #close-modal-btn {
                position: absolute;
                top: 4px;
                right: 4px;
                padding: 2px 8px;
                border-radius: 2px;
                border: none;
                background-color: var(--danger);
            }

            .correct-answer label {
                border: 2px solid var(--success);
                width: 100%;
            }

            .incorrect-answer label {
                border: 2px solid var(--danger);
                width: 100%;
            }

            .options-container {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            #quiz-meta-container {
                border-radius: 8px;
                background-color: var(--primary-color);
                margin-bottom: 12px;
                padding: 8px;
            }

            #quiz-title {
                text-align: center;
                font-size: 24px;
                margin-bottom: 8px;
            }

            #quiz-description {
                line-height: 1.5;
                padding: 2px 6px;
            }
        </style>
    </head>

    <body onload="main()">
        <main>
            <section id="quiz-meta-container">
                <h1 id="quiz-title"></h1>
                <p id="quiz-description"></p>
            </section>
            <section id="score-stats-container">
                <div id="score-card">
                    Score: <span id="current-score">999</span> of
                    <span id="pass-percent">999%</span>
                </div>
                <div>Correct: <span id="correct-answers">999</span></div>
                <div>Incorrect: <span id="wrong-answers">999</span></div>
            </section>

            <section id="quiz-container"></section>

            <dialog id="modal" class="modal-container">
                <div id="modal-content">
                    <p id="modal-text"></p>
                </div>
            </dialog>
        </main>

        <script>
            const quizData = {"quiz_id": 6038710, "quiz_description": null, "quiz_title": "Dynamic Values & Props", "pass_percent": null, "questions": [{"_class": "assessment", "id": 68704946, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which syntax can be used to output dynamic values /&nbsp;JavaScript expressions in JSX?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. Using square brackets in your JSX code will simply display some square brackets on the screen.", "That's wrong. Using parentheses in your JSX code will simply display some parentheses on the screen.", "That's correct!", "That's wrong. Unlike in some other frameworks or libraries, only a single pair of curly braces is needed."], "answers": ["<p>[ ] (Square brackets)</p>", "<p>( )&nbsp;(Parentheses)</p>", "<p>{ } (Curly braces)</p>", "<p>{{ }} (Double curly braces)</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Which syntax can be used to output dynamic values /&nbsp;JavaScript expressions in JSX?", "related_lectures": []}, {"_class": "assessment", "id": 68705040, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which values can be output as dynamic values in JSX (i.e., between curly braces)?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. JavaScript statements like function definitions, if-statements etc. can't bet used as part of your JSX code / between curly braces in JSX code.", "That's wrong - there is no such thing as a \"React template\" or \"React template instruction\".", "That's correct. You could output expressions like \"1 + 1\", variables / constants that hold values, the result of calling a function etc.", "That's wrong - there is no such thing as a \"React template\" or \"React template expression\"."], "answers": ["<p>Any valid JavaScript statement</p>", "<p>Any valid React template instruction</p>", "<p>Any valid JavaScript expression</p>", "<p>Any valid React template expression</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Which values can be output as dynamic values in JSX (i.e., between curly braces)?", "related_lectures": []}, {"_class": "assessment", "id": 68705258, "assessment_type": "multiple-choice", "prompt": {"question": "<p>How should you typically load /&nbsp;use images in React projects?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. Whilst this might work in some projects during development, chances are high that the paths would be incorrect after building the project for production and deploying it.", "That's correct. By \"importing\" the image, a production-safe path gets generated under the hood.", "That's wrong. Whilst this might work in some projects during development, chances are high that the paths would be incorrect after building the project for production and deploying it.", "That's wrong. You can't set the image as a value."], "answers": ["<p>Set the &lt;img&gt;&nbsp;src equal to a relative string path to the image</p>", "<p>Set the &lt;img&gt;&nbsp;src equal to the path generated via an import statement (that points at the image)</p>", "<p>Set the &lt;img&gt;&nbsp;src equal to an absolute string path to the image</p>", "<p>Set the &lt;img&gt;&nbsp;src equal to the image itself</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "How should you typically load /&nbsp;use images in React projects?", "related_lectures": []}, {"_class": "assessment", "id": 68705292, "assessment_type": "multiple-choice", "prompt": {"question": "<p>How can you assign a dynamic value to an HTML&nbsp;element attribute?</p>", "relatedLectureIds": "", "feedbacks": ["That's correct. You simply replace the text value you would normally set for attributes with the dynamic (curly-brace-wrapped) value.", "That's wrong - there is no such thing as a \"directive\" in React projects. There is no special attribute syntax or feature.", "That's wrong. The idea is to set a dynamic value, not some hard-coded string", "That's wrong - there is no such thing as a \"React template\" and no special attribute syntax."], "answers": ["<p>Via the same syntax you use for dynamic values in JSX in general:&nbsp;Curly braces</p>", "<p>Via the special React attribute directive that can be added to all built-in and custom components</p>", "<p>Via the same syntax you use for attributes in general:&nbsp;You set the value as a hard-coded string</p>", "<p>Via the special React template attribute syntax that allows you to store dynamic values for attributes</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "How can you assign a dynamic value to an HTML&nbsp;element attribute?", "related_lectures": []}, {"_class": "assessment", "id": 68705308, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which core React concept can increase the reusability of React components?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong. JSX is definitely an important concept (especially for components) but it's not increasing the reusability.", "That's wrong. Classes don't have anything to do with that.", "That's wrong. Components are indeed defined as functions but that's true for all components - no matter how reusable they may be.", "That's correct! Props are essentially custom attributes that can be set on components."], "answers": ["<p>JSX</p>", "<p>Classes</p>", "<p>Functions</p>", "<p>Props</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "Which core React concept can increase the reusability of React components?", "related_lectures": []}, {"_class": "assessment", "id": 68705676, "assessment_type": "multiple-choice", "prompt": {"question": "<p>How do \"props\"&nbsp;work in React?</p>", "relatedLectureIds": "", "feedbacks": ["That's wrong, props can be set as described but they're not output in the JSX code automatically.", "That's correct! React automatically passes a props object as the first argument to the receiving component", "That's wrong - props can be set as described but they are not set as constants thereafter. Instead, they are received as a parameter (an object)", "That's wrong, there is no \"getProps()\" function"], "answers": ["<p>You can set props (\"custom attributes\") on components to automatically output them in the component's JSX&nbsp;code</p>", "<p>You can set props (\"custom attributes\") on components to then extract &amp; use them in the receiving component</p>", "<p>You can set props (\"custom attributes\") on components which then receive them as automatically provided constants in the function body</p>", "<p>You can set props (\"custom attributes\") on components which can then call a getProps() function to extract the received values</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "How do \"props\"&nbsp;work in React?", "related_lectures": []}, {"_class": "assessment", "id": 68706140, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following four code examples for setting &amp;&nbsp;extracting props would NOT&nbsp;work as intended?</p><p><em>I.e., which example will NOT&nbsp;output the text \"Priority: 5\" on the screen.</em></p>", "relatedLectureIds": "", "feedbacks": ["That's not the right choice. This syntax might look weird (and indeed also is unnecessarily complicated) but it would work. You can use \"Rest properties\" to group properties that have not been \"pulled out\" via destructuring into a new object (\"props\" in this case). So the \"priority\" prop could be extracted from the props object as shown.", "That's not the right choice. React automatically passes a \"props\" object as a first argument to the component function. This object contains all props (\"custom attributes\") as key-value pairs (i.e., as properties). So accessing \"priority\" on \"props\" will work", "That's not the right choice. This example will work as React automatically passed an object with all \"custom attributes\" as a first argument to the component function. Object destructuring can then be used as shown in this example to \"pull out\" the props the component needs.", "That's the right choice. The error is subtle but this example does NOT use object destructuring. So here, the \"priority\" prop is not pulled out of the props object. Instead, it's now the entire props object that's named \"priority\". This wouldn't be a problem since the name is up to you. But it's now the entire object that's output in the paragraph, not the \"priority\" property. Therefore, the output would not be \"Priority: 5\" but instead \"Priority: [Object object]\" (or something like that)."], "answers": ["<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent({...props}) {\n  return &lt;p&gt;Priority:&nbsp;{props.priority}&lt;/p&gt;\n}</pre>", "<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent(props) {\n  return &lt;p&gt;Priority:&nbsp;{props.priority}&lt;/p&gt;\n}</pre>", "<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent({priority}) {\n  return &lt;p&gt;Priority:&nbsp;{priority}&lt;/p&gt;\n}</pre>", "<pre class=\"prettyprint linenums\">&lt;MyComponent priority={5} /&gt;</pre><p><br></p><pre class=\"prettyprint linenums\">function MyComponent(priority) {\n  return &lt;p&gt;Priority:&nbsp;{priority}&lt;/p&gt;\n}</pre>"]}, "correct_response": ["d"], "section": "", "question_plain": "Which of the following four code examples for setting &amp;&nbsp;extracting props would NOT&nbsp;work as intended?I.e., which example will NOT&nbsp;output the text \"Priority: 5\" on the screen.", "related_lectures": []}]};
            let correct = new Set();
            let incorrect = new Set();
            let totalNumberOfQuestions = 0;
            const quizTitle = quizData.quiz_title;
            const quizDescription = quizData.quiz_description;
            const questionData = quizData.questions;
            const passPercent = quizData.pass_percent;
            const modalTextElement = document.getElementById("modal-text");
            const quizContainerElement = document.getElementById("quiz-container");

            const dialog = document.querySelector("dialog");
            const showButton = document.getElementById("view-explanatin");
            const closeButton = document.getElementById("close-modal-btn");
            const quizTitleElement = document.getElementById("quiz-title");
            const quizDescriptionElement = document.getElementById("quiz-description");

            function main() {
                // update quiz meta data
                document.title = quizTitle;
                quizTitleElement.innerHTML = quizTitle;
                quizDescriptionElement.innerHTML = quizDescription;

                const passPercentElement = document.getElementById("pass-percent");
                passPercentElement.innerHTML = passPercent + "%";
                totalNumberOfQuestions = questionData.length;
                // shuffle the questionData to randomize the order of the questions
                for (let i = questionData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questionData[i], questionData[j]] = [questionData[j], questionData[i]];
                }

                let formattedQuestions = questionData.map(formatSingleQuestionData);
                updateScore();
                // display the formattedQuestions
                formattedQuestions.forEach((question, idx) => {
                    renderSingleQuestion(question, idx + 1);
                });
            }

            /**
             * Formats the question data from the given QuizData object.
             *
             * @param {Object} singleQuizData - The singleQuizData object containing prompt and correct_response.
             * @return {Object} The formatted question object with the following properties:
             *   - id: The ID of the question.
             *   - question: The text of the question.
             *   - answers: The array of answer options.
             *   - correctAnswer: The text of the correct answer.
             *   - explanation: The explanation of the correct answer.
             */
            function formatSingleQuestionData(singleQuizData = null) {
                const { prompt, correct_response, id } = singleQuizData;
                const questionText = prompt.question;
                const answers = prompt.answers;
                const correctAnswer = correct_response[0];
                const correctAnswerText = answers[correctAnswer.toLowerCase().charCodeAt(0) - 97];
                const questionObj = {
                    id: id,
                    question: questionText,
                    answers: answers,
                    correctAnswer: correctAnswerText,
                    explanation: prompt?.explanation || "",
                };
                return questionObj;
            }

            /**
             * Renders a single question with its options and submit button.
             *
             * @param {Object} singleQuestionData - The data of the question to render.
             * @param {number} rootIndex - The index of the question in the quiz.
             * @return {void} return nothing.
             */

            const renderSingleQuestion = (singleQuestionData = {}, rootIndex = 1) => {
                const { id, explanation, answers, correctAnswer, question } = singleQuestionData;
                // shuffle the answers to randomize the order of the answers
                for (let i = answers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [answers[i], answers[j]] = [answers[j], answers[i]];
                }
                const optionsHTML = answers
                    .map((option, index) => {
                        const optionId = `${id}_${index}`;

                        return `
        <div class="question-lable">
          <input type="radio" id="${optionId}" name="${"answer"}" value="${option}" />
          <label for="${optionId}">${option}</label>
        </div>
      `;
                    })

                    .join("");

                const container = document.createElement("div");
                container.innerHTML = `
        <form data-correct-answer="${correctAnswer}" data-question-id="${id}" class="single-question-container" onsubmit="submitButtonListener(event)">
          <div style="display: flex;justify-content: space-between;">
            <p style="font-weight: 600">Question ${rootIndex}:</p>
            <button type="button" onclick="renderExplanation(event)" id="${`explanation-${id}`}" data-explanation="${explanation}" class="explanation-btn">View Explanation</button>
          </div>
          <p style="margin-bottom: 8px;line-height: 1.5">${question}</p>
          <div class="options-container">
            ${optionsHTML}
          </div>
          <div style="display: flex; gap: 8px;">
            <button type="submit" id="submit-button" class="button">Submit</button>
          </div>
        </form>
      `;
                quizContainerElement.appendChild(container);
            };

            /**
             * Updates the score on the page based on the number of correct and incorrect answers.
             *
             * @return {void} This function does not return a value.
             */
            function updateScore() {
                const currentParcentageElement = document.getElementById("current-score");
                const correctAnswerElement = document.getElementById("correct-answers");
                const wrongAnswerElement = document.getElementById("wrong-answers");
                correctAnswerElement.innerHTML = correct.size;
                wrongAnswerElement.innerHTML = incorrect.size;
                const score = Number((correct.size / totalNumberOfQuestions) * 100).toFixed(2);
                currentParcentageElement.innerHTML = score;
            }

            /**
             * Handles the event when the submit button is clicked.
             *
             * @param {Event} e - The event object.
             * @return {void} This function does not return anything.
             */
            const submitButtonListener = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const form = e.target;
                const selectedOption = e.target.querySelector('input[type="radio"]:checked');
                if (!selectedOption) {
                    alert("Please select an answer!");
                    return;
                }

                let isCorrect = false;
                const { answer: userAnswer } = Object.fromEntries(formData.entries());
                const correctAnswer = e.target.dataset.correctAnswer;
                const questionId = e.target.dataset.questionId;
                if (userAnswer == correctAnswer) {
                    correct.add(questionId);
                    incorrect.delete(questionId);
                    isCorrect = true;
                } else {
                    incorrect.add(e.target.dataset.questionId);
                    correct.delete(questionId);
                }
                updateScore();

                const resultClass = isCorrect ? "correct-answer" : "incorrect-answer";

                form.querySelectorAll(".question-lable").forEach((label) => {
                    label.classList.remove("correct-answer", "incorrect-answer");
                });
                selectedOption.closest(".question-lable").classList.add(resultClass);
            };

            function renderExplanation(ev) {
                modalTextElement.innerHTML = ev.target.dataset?.explanation || "no explanation found";
                dialog.showModal();
                dialog.addEventListener("click", (event) => {
                    if (event.target === dialog) {
                        dialog.close();
                    }
                });
            }
        </script>
    </body>
</html>
