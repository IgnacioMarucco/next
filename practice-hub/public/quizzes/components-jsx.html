<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Components & JSX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 60px;
      padding-bottom: 40px;
      line-height: 1.6;
    }
    .score-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .badge-score { background: #3b82f6; color: white; }
    .badge-correct { background: var(--success); color: white; }
    .badge-incorrect { background: var(--danger); color: white; }
    
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .quiz-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .quiz-header h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .quiz-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.95rem;
    }
    .question-body {
      font-size: 1rem;
      color: var(--text);
    }
    .question-body pre, .option-label pre {
      background: #060911;
      border: 1px solid #1e293b;
      padding: 0.75rem;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      margin: 0.5rem 0;
      overflow-x: auto;
    }
    .question-body code, .option-label code {
      font-family: 'Fira Code', monospace;
      background: rgba(0,0,0,0.3);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #fbbf24;
      font-size: 0.9em;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: #0c1322;
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-item:hover {
      border-color: var(--accent);
      background: #111a2e;
    }
    .option-item input[type="radio"] {
      margin-top: 0.25rem;
      cursor: pointer;
      accent-color: var(--accent);
      width: 1.1rem;
      height: 1.1rem;
    }
    .option-label {
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .option-item.correct {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
    }
    .option-item.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-bg) !important;
    }
    .btn-submit {
      align-self: flex-start;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
    }
    .feedback-box {
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.pass {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .feedback-box.fail {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="score-bar">
    <div>📊 <span id="quiz-title-nav"></span></div>
    <div class="score-badge">
      <span class="badge badge-score" id="score-text">Score: 0%</span>
      <span class="badge badge-correct" id="correct-text">Correct: 0</span>
      <span class="badge badge-incorrect" id="incorrect-text">Incorrect: 0</span>
    </div>
  </div>

  <div class="container">
    <div class="quiz-header">
      <h1 id="quiz-title-main"></h1>
      <p id="quiz-desc"></p>
    </div>

    <div id="questions-container" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
  </div>

  <script>
    const rawQuizData = {"quiz_id":6038702,"quiz_description":null,"quiz_title":"Components & JSX","pass_percent":null,"questions":[{"_class":"assessment","id":68658750,"assessment_type":"multiple-choice","prompt":{"question":"<p>From the perspective of a developer:&nbsp;What's one advantage of building a user interface by combining components?</p>","relatedLectureIds":"","feedbacks":["That's wrong. Whilst you will later learn about techniques that allow you to improve application performance, components on their own do NOT provide a performance benefit. The overall app is the same, no matter if you split it into components or not.","That's correct! As a developer, it's typically easier to work on smaller, more manageable building blocks. In addition, if a certain building block must be used in different parts of the UI, you can simply reuse it (instead of copying &amp; pasting it) if built as a component.","That's wrong. Components are a nice (and important!) feature but they do not unlock some kind of \"more powerful features\". You can use the same React and web dev features, no matter if you're using components or not.","That's wrong. Because whilst you could argue that by using components, it's easier to build complex / advanced websites, components are not required to build such websites. They might make it easier but they're not a prerequisite."],"answers":["<p>Better performance</p>","<p>Small, reusable building blocks</p>","<p>More powerful features</p>","<p>Can build advanced websites</p>"]},"correct_response":["b"],"section":"","question_plain":"From the perspective of a developer:&nbsp;What's one advantage of building a user interface by combining components?","related_lectures":[]},{"_class":"assessment","id":68658806,"assessment_type":"multiple-choice","prompt":{"question":"<p>When working with React: How is a new component defined?</p>","relatedLectureIds":"","feedbacks":["That's wrong. That's how you would USE a custom component - but it's now how you DEFINE it.","That's wrong. Custom components do indeed typically use JSX code and they are also typically used inside of JSX code but they're not DEFINED just by using JSX code.","That's correct! A component, in React, is simply a function that returns renderable content - typically JSX code. After being defined, a custom component can be used like a built-in HTML element inside of other components' JSX code.","That's wrong. There is no such function in the React library."],"answers":["<p>By adding a custom element like &lt;Header /&gt; to your HTML&nbsp;code</p>","<p>By using JSX in your code files</p>","<p>By creating a function that returns JSX&nbsp;code</p>","<p>By using React's createComponent() function</p>"]},"correct_response":["c"],"section":"","question_plain":"When working with React: How is a new component defined?","related_lectures":[]},{"_class":"assessment","id":68658938,"assessment_type":"multiple-choice","prompt":{"question":"<p>What's the purpose of JSX?</p>","relatedLectureIds":"","feedbacks":["That's wrong. Whilst you will typically use your components in JSX code, JSX is actually not a prerequisite. It's also not required to create custom components - instead that's done by creating a JavaScript function.","That's wrong. JSX is used a lot in React but you could use React without JSX.","That's wrong. JSX is used a lot in React but you could use React without JSX.","That's correct. The idea behind JSX is that you have an easier time defining the target HTML code that should be generated by your components."],"answers":["<p>It allows you to create custom components and elements</p>","<p>It allows you to work with React and components</p>","<p>It's required by React</p>","<p>It allows you to define the target HTML&nbsp;code inside of your components</p>"]},"correct_response":["d"],"section":"","question_plain":"What's the purpose of JSX?","related_lectures":[]},{"_class":"assessment","id":68658974,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which statement about JSX is TRUE?</p>","relatedLectureIds":"","feedbacks":["That's correct. JSX allows you to define the target UI / HTML code right inside your JavaScript code - and therefore right inside your components.","That's wrong. You can also output built-in components.","That's wrong. JSX code is not a native JavaScript feature and therefore won't work in browsers.","That's wrong. The core idea behind JSX is to use HTML-like code in JavaScript files. HTML is HTML."],"answers":["<p>JSX code is used to define the target UI /&nbsp;HTML&nbsp;code</p>","<p>JSX&nbsp;code can only be used to output custom components</p>","<p>JSX code would run in the browser</p>","<p>JSX&nbsp;code must be stored in <code>.html</code> files</p>"]},"correct_response":["a"],"section":"","question_plain":"Which statement about JSX is TRUE?","related_lectures":[]},{"_class":"assessment","id":68659000,"assessment_type":"multiple-choice","prompt":{"question":"<p>What does React do with the components you use in the JSX&nbsp;code?</p>","relatedLectureIds":"","feedbacks":["That's wrong. React does not generate any HTML file.","That's correct. Your JSX code leads to a tree-like code structure that \"tells\" React how the different components are related and how the UI should look like. It then executes appropriate commands to manipulate the real DOM to reflect that target structure / code.","That's wrong. React does not derive or generate any HTML file","That's wrong. React does not derive or generate any HTML file"],"answers":["<p>It generates a HTML&nbsp;file that's then served by the browser</p>","<p>It derives a component tree that's then used to perform commands that update the website DOM</p>","<p>It derives a HTML&nbsp;file that's then used to perform commands that update the website DOM</p>","<p>It generates a component tree that's then translated to an HTML&nbsp;file</p>"]},"correct_response":["b"],"section":"","question_plain":"What does React do with the components you use in the JSX&nbsp;code?","related_lectures":[]},{"_class":"assessment","id":68659104,"assessment_type":"multiple-choice","prompt":{"question":"<p>How do you typically use custom components?</p>","relatedLectureIds":"","feedbacks":["That's correct!","That's wrong. You never call component functions directly. Instead, React will do that for you.","That's wrong. Whilst you will indeed use ReactDOM's render() method to render the root component of your app, you'll not use that method to output all your custom components.","That's wrong. You never use your components like HTML code in any HTML file. They wouldn't work there."],"answers":["<p>You use custom components like HTML&nbsp;elements inside of JSX code</p>","<p>You call the custom component functions inside of other component functions</p>","<p>You pass the custom component functions as identifiers to ReactDOM's <code>render()</code> method</p>","<p>You use custom components in the <code>index.html</code> or any other HTML&nbsp;file</p>"]},"correct_response":["a"],"section":"","question_plain":"How do you typically use custom components?","related_lectures":[]},{"_class":"assessment","id":68706502,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which statement about custom components is FALSE?</p>","relatedLectureIds":"","feedbacks":["That's the wrong choice because this statement is right. Custom components are created by simply defining a JavaScript function","That's the wrong choice because this statement is right. To use custom components in JSX code, their name must start with an uppercase character. That's how React tells them apart from built-in components / elements.","That's the wrong choice because this statement is right. Custom components do indeed need to return renderable content.","That's the right choice because this statement is WRONG. You can define custom components wherever you want."],"answers":["<p>Custom components can be created as JavaScript functions</p>","<p>To use custom components in JSX, they must start with an uppercase character</p>","<p>Custom components must return renderable content (typically JSX)</p>","<p>Custom components must be defined next to the components that want to use them</p>"]},"correct_response":["d"],"section":"","question_plain":"Which statement about custom components is FALSE?","related_lectures":[]}]};
    const questions = rawQuizData.questions || [];
    const userAnswers = new Map(); // questionIndex -> { selectedIndex, isCorrect }

    document.getElementById('quiz-title-nav').textContent = rawQuizData.quiz_title || 'Quiz';
    document.getElementById('quiz-title-main').textContent = rawQuizData.quiz_title || 'React Quiz';
    document.getElementById('quiz-desc').textContent = rawQuizData.quiz_description || 'Select the correct answer for each question below and click Submit.';

    function updateScore() {
      let correct = 0;
      let incorrect = 0;
      userAnswers.forEach((ans) => {
        if (ans.isCorrect) correct++;
        else incorrect++;
      });
      const answered = correct + incorrect;
      const pct = answered > 0 ? ((correct / questions.length) * 100).toFixed(1) : 0;

      document.getElementById('score-text').textContent = 'Score: ' + pct + '% (' + correct + '/' + questions.length + ')';
      document.getElementById('correct-text').textContent = 'Correct: ' + correct;
      document.getElementById('incorrect-text').textContent = 'Incorrect: ' + incorrect;
    }

    const container = document.getElementById('questions-container');

    questions.forEach((q, qIndex) => {
      const qPrompt = q.prompt || {};
      const answers = qPrompt.answers || [];
      const feedbacks = qPrompt.feedbacks || [];
      const correctChar = (q.correct_response && q.correct_response[0]) ? q.correct_response[0].toLowerCase() : 'a';
      const correctIndex = correctChar.charCodeAt(0) - 97;

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'question-' + qIndex;

      let optionsHtml = '';
      answers.forEach((ans, aIndex) => {
        const optionId = 'q_' + qIndex + '_opt_' + aIndex;
        optionsHtml += `
          <label class="option-item" id="item_${qIndex}_${aIndex}" for="${optionId}">
            <input type="radio" name="q_${qIndex}" id="${optionId}" value="${aIndex}" />
            <div class="option-label">${ans}</div>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="question-top">
          <span>Question ${qIndex + 1} of ${questions.length}</span>
        </div>
        <div class="question-body">${qPrompt.question || ''}</div>
        <div class="options-list">${optionsHtml}</div>
        <button class="btn-submit" onclick="submitQuestion(${qIndex}, ${correctIndex})">Submit Answer</button>
        <div class="feedback-box" id="feedback-${qIndex}"></div>
      `;

      container.appendChild(card);
    });

    window.submitQuestion = function(qIndex, correctIndex) {
      const selected = document.querySelector('input[name="q_' + qIndex + '"]:checked');
      if (!selected) {
        alert('Please select an option first!');
        return;
      }

      const selectedIndex = parseInt(selected.value, 10);
      const isCorrect = selectedIndex === correctIndex;
      userAnswers.set(qIndex, { selectedIndex, isCorrect });

      const q = questions[qIndex];
      const feedbacks = (q.prompt && q.prompt.feedbacks) ? q.prompt.feedbacks : [];
      const feedbackText = feedbacks[selectedIndex] || (isCorrect ? "Correct answer!" : "Incorrect answer.");

      // Visual classes
      const card = document.getElementById('question-' + qIndex);
      const options = card.querySelectorAll('.option-item');
      options.forEach((opt, idx) => {
        opt.classList.remove('correct', 'incorrect');
        if (idx === correctIndex) opt.classList.add('correct');
        else if (idx === selectedIndex && !isCorrect) opt.classList.add('incorrect');
      });

      const feedbackBox = document.getElementById('feedback-' + qIndex);
      feedbackBox.className = 'feedback-box show ' + (isCorrect ? 'pass' : 'fail');
      feedbackBox.innerHTML = '<strong>' + (isCorrect ? '✅ Correct! ' : '❌ Incorrect. ') + '</strong>' + feedbackText;

      updateScore();
    };

    updateScore();
  </script>
</body>
</html>
