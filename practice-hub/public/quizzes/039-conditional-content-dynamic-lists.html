<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>039 Conditional Content & Dynamic Lists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 60px;
      padding-bottom: 40px;
      line-height: 1.6;
    }
    .score-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .badge-score { background: #3b82f6; color: white; }
    .badge-correct { background: var(--success); color: white; }
    .badge-incorrect { background: var(--danger); color: white; }
    
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .quiz-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .quiz-header h1 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .quiz-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.95rem;
    }
    .question-body {
      font-size: 1rem;
      color: var(--text);
    }
    .question-body pre, .option-label pre {
      background: #060911;
      border: 1px solid #1e293b;
      padding: 0.75rem;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      margin: 0.5rem 0;
      overflow-x: auto;
    }
    .question-body code, .option-label code {
      font-family: 'Fira Code', monospace;
      background: rgba(0,0,0,0.3);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #fbbf24;
      font-size: 0.9em;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: #0c1322;
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-item:hover {
      border-color: var(--accent);
      background: #111a2e;
    }
    .option-item input[type="radio"] {
      margin-top: 0.25rem;
      cursor: pointer;
      accent-color: var(--accent);
      width: 1.1rem;
      height: 1.1rem;
    }
    .option-label {
      flex: 1;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .option-item.correct {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
    }
    .option-item.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-bg) !important;
    }
    .btn-submit {
      align-self: flex-start;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
    }
    .feedback-box {
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.pass {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .feedback-box.fail {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="score-bar">
    <div>📊 <span id="quiz-title-nav"></span></div>
    <div class="score-badge">
      <span class="badge badge-score" id="score-text">Score: 0%</span>
      <span class="badge badge-correct" id="correct-text">Correct: 0</span>
      <span class="badge badge-incorrect" id="incorrect-text">Incorrect: 0</span>
    </div>
  </div>

  <div class="container">
    <div class="quiz-header">
      <h1 id="quiz-title-main"></h1>
      <p id="quiz-desc"></p>
    </div>

    <div id="questions-container" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>
  </div>

  <script>
    const rawQuizData = {"quiz_id":6038734,"quiz_description":null,"quiz_title":"Conditional Content & Dynamic Lists","pass_percent":null,"questions":[{"_class":"assessment","id":68904742,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which of the following code snippets WILL&nbsp;NOT&nbsp;output the content conditionally?</p>","relatedLectureIds":"","feedbacks":["That's the wrong choice because this code will work. You can display content conditionally with help of the logical AND operator (&amp;&amp;)","That's the wrong choice because this code will work. You can display content conditionally with help of a ternary expression.","That's the wrong choice because this code will work. You can display content conditionally with help of a conditionally set variable.","That's the right choice because this code won't work. There is no default \"show\" prop that could be set on built-in elements to show (or hide) them."],"answers":["<pre class=\"prettyprint linenums\">function SomeComponent() {\n  const [contentIsVisible, setContentIsVisible] = useState(false);\n\n  function handleClick() {\n    setContentIsVisible(true);\n  }\n\n  return (\n    &lt;div&gt;\n     {contentIsVisible &amp;&amp;&nbsp;&lt;p&gt;Visible&lt;/p&gt;}\n     &lt;button onClick={handleClick}&gt;Show Content&lt;/button&gt;\n    &lt;/div&gt;\n  );\n}</pre>","<pre class=\"prettyprint linenums\">function SomeComponent() {\n  const [contentIsVisible, setContentIsVisible] = useState(false);\n\n  function handleClick() {\n    setContentIsVisible(true);\n  }\n\n  return (\n    &lt;div&gt;\n     {contentIsVisible ?&nbsp;&lt;p&gt;Visible&lt;/p&gt; :&nbsp;null}\n     &lt;button onClick={handleClick}&gt;Show Content&lt;/button&gt;\n    &lt;/div&gt;\n  );\n}</pre>","<pre class=\"prettyprint linenums\">function SomeComponent() {\n  const [contentIsVisible, setContentIsVisible] = useState(false);\n\n  function handleClick() {\n    setContentIsVisible(true);\n  }\n\n  let content;\n\n  if (contentIsVisible) {\n    content =&nbsp;&lt;p&gt;Visible&lt;/p&gt;;\n  }\n\n  return (\n    &lt;div&gt;\n     {content}\n     &lt;button onClick={handleClick}&gt;Show Content&lt;/button&gt;\n    &lt;/div&gt;\n  );\n}</pre>","<pre class=\"prettyprint linenums\">function SomeComponent() {\n  const [contentIsVisible, setContentIsVisible] = useState(false);\n\n  function handleClick() {\n    setContentIsVisible(true);\n  }\n\n  return (\n    &lt;div&gt;\n     &lt;p show={contentIsVisible}&gt;Visible&lt;/p&gt;\n     &lt;button onClick={handleClick}&gt;Show Content&lt;/button&gt;\n    &lt;/div&gt;\n  );\n}</pre>"]},"correct_response":["d"],"section":"","question_plain":"Which of the following code snippets WILL&nbsp;NOT&nbsp;output the content conditionally?","related_lectures":[]},{"_class":"assessment","id":68904772,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which code snippet WILL&nbsp;WORK&nbsp;and output a list dynamically?</p>","relatedLectureIds":"","feedbacks":["That's the wrong choice - there is no built-in list function.","That's the right choice!","That's the wrong choice - there is no built-in transform function.","That's the wrong choice because this code will not work. You can't use a for loop inside of JSX code and output content like this."],"answers":["<pre class=\"prettyprint linenums\">&lt;ul&gt;\n  {[1, 2, 3].list(number =&gt; &lt;li key={number}&gt;{number}&lt;/li&gt;)}\n&lt;/ul&gt;</pre>","<pre class=\"prettyprint linenums\">&lt;ul&gt;\n  {[1, 2, 3].map(number =&gt; &lt;li key={number}&gt;{number}&lt;/li&gt;)}\n&lt;/ul&gt;</pre>","<pre class=\"prettyprint linenums\">&lt;ul&gt;\n  {[1, 2, 3].transform(number =&gt; &lt;li key={number}&gt;{number}&lt;/li&gt;)}\n&lt;/ul&gt;</pre>","<pre class=\"prettyprint linenums\">&lt;ul&gt;\n{\n  for (const number of [1, 2, 3]) {\n    &lt;li key={number}&gt;{number}&lt;/li&gt;\n  }\n}\n&lt;/ul&gt;</pre>"]},"correct_response":["b"],"section":"","question_plain":"Which code snippet WILL&nbsp;WORK&nbsp;and output a list dynamically?","related_lectures":[]},{"_class":"assessment","id":68904892,"assessment_type":"multiple-choice","prompt":{"question":"<p>What's the problem with this code?</p><pre class=\"prettyprint linenums\">&lt;div&gt;\n  {someArray.map(item =&gt; &lt;p&gt;{item}&lt;/p&gt;)}\n&lt;/div&gt;</pre>","relatedLectureIds":"","feedbacks":["That's wrong, you don't have to use <li></li>","That's wrong - you can output dynamic data anywhere you want.","That's the right choice because that's the problem with this code. When dynamically outputting a list of elements, every element should receive a unique \"key\" to help React tell the list items apart.","That's wrong, this answer doesn't make any sense. There is no \"list\" prop that could be set."],"answers":["<p>You can only map to <code>&lt;li&gt;</code>, not to <code>&lt;p&gt;</code> </p>","<p>You can only output list data between <code>&lt;ul&gt;</code>&nbsp;tags, not <code>&lt;div&gt;</code> </p>","<p>You should add a <code>key</code> prop to the list item</p>","<p>You should add a <code>list</code> prop to the <code>&lt;ul&gt;</code> </p>"]},"correct_response":["c"],"section":"","question_plain":"What's the problem with this code?&lt;div&gt;\n  {someArray.map(item =&gt; &lt;p&gt;{item}&lt;/p&gt;)}\n&lt;/div&gt;","related_lectures":[]}]};
    const questions = rawQuizData.questions || [];
    const userAnswers = new Map(); // questionIndex -> { selectedIndex, isCorrect }

    document.getElementById('quiz-title-nav').textContent = "039 Conditional Content & Dynamic Lists";
    document.getElementById('quiz-title-main').textContent = "039 Conditional Content & Dynamic Lists";
    document.getElementById('quiz-desc').textContent = rawQuizData.quiz_description || 'Select the correct answer for each question below and click Submit.';

    function updateScore() {
      let correct = 0;
      let incorrect = 0;
      userAnswers.forEach((ans) => {
        if (ans.isCorrect) correct++;
        else incorrect++;
      });
      const answered = correct + incorrect;
      const pct = answered > 0 ? ((correct / questions.length) * 100).toFixed(1) : 0;

      document.getElementById('score-text').textContent = 'Score: ' + pct + '% (' + correct + '/' + questions.length + ')';
      document.getElementById('correct-text').textContent = 'Correct: ' + correct;
      document.getElementById('incorrect-text').textContent = 'Incorrect: ' + incorrect;
    }

    const container = document.getElementById('questions-container');

    questions.forEach((q, qIndex) => {
      const qPrompt = q.prompt || {};
      const answers = qPrompt.answers || [];
      const feedbacks = qPrompt.feedbacks || [];
      const correctChar = (q.correct_response && q.correct_response[0]) ? q.correct_response[0].toLowerCase() : 'a';
      const correctIndex = correctChar.charCodeAt(0) - 97;

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'question-' + qIndex;

      let optionsHtml = '';
      answers.forEach((ans, aIndex) => {
        const optionId = 'q_' + qIndex + '_opt_' + aIndex;
        optionsHtml += `
          <label class="option-item" id="item_${qIndex}_${aIndex}" for="${optionId}">
            <input type="radio" name="q_${qIndex}" id="${optionId}" value="${aIndex}" />
            <div class="option-label">${ans}</div>
          </label>
        `;
      });

      card.innerHTML = `
        <div class="question-top">
          <span>Question ${qIndex + 1} of ${questions.length}</span>
        </div>
        <div class="question-body">${qPrompt.question || ''}</div>
        <div class="options-list">${optionsHtml}</div>
        <button class="btn-submit" onclick="submitQuestion(${qIndex}, ${correctIndex})">Submit Answer</button>
        <div class="feedback-box" id="feedback-${qIndex}"></div>
      `;

      container.appendChild(card);
    });

    window.submitQuestion = function(qIndex, correctIndex) {
      const selected = document.querySelector('input[name="q_' + qIndex + '"]:checked');
      if (!selected) {
        alert('Please select an option first!');
        return;
      }

      const selectedIndex = parseInt(selected.value, 10);
      const isCorrect = selectedIndex === correctIndex;
      userAnswers.set(qIndex, { selectedIndex, isCorrect });

      const q = questions[qIndex];
      const feedbacks = (q.prompt && q.prompt.feedbacks) ? q.prompt.feedbacks : [];
      const feedbackText = feedbacks[selectedIndex] || (isCorrect ? "Correct answer!" : "Incorrect answer.");

      // Visual classes
      const card = document.getElementById('question-' + qIndex);
      const options = card.querySelectorAll('.option-item');
      options.forEach((opt, idx) => {
        opt.classList.remove('correct', 'incorrect');
        if (idx === correctIndex) opt.classList.add('correct');
        else if (idx === selectedIndex && !isCorrect) opt.classList.add('incorrect');
      });

      const feedbackBox = document.getElementById('feedback-' + qIndex);
      feedbackBox.className = 'feedback-box show ' + (isCorrect ? 'pass' : 'fail');
      feedbackBox.innerHTML = '<strong>' + (isCorrect ? '✅ Correct! ' : '❌ Incorrect. ') + '</strong>' + feedbackText;

      updateScore();
    };

    updateScore();
  </script>
</body>
</html>
